; Limites d'envoi de fichiers pour Pupitre (zones de dépôt des concerts, médiathèque), quand PHP tourne en
; CGI ou en FPM : ce fichier est alors lu de lui-même (au bout de cinq minutes au plus). Sous mod_php, il est
; ignoré : régler les mêmes valeurs dans la configuration du serveur. Pupitre affiche la limite en vigueur.
upload_max_filesize = 300M
post_max_size = 320M
max_file_uploads = 30
max_input_time = 600
